# Wealth Wire runtime configuration.
# The User-Agent is sent with every request. SEC.gov requires a contact email in it —
# replace the placeholder with your own address.
contact_email: santimiguel10@outlook.com
user_agent: "WealthWire/0.1 (personal news reader; {contact_email})"

timezone: America/Los_Angeles      # used for digest dates and naive listing-page dates

http:
  per_host_delay_seconds: 2.0      # minimum gap between requests to the same host
  timeout_seconds: 15
  retries: 1                       # one retry with backoff
  backoff_seconds: 2.0

cluster:
  window_hours: 72                 # only group items published within this window of each other
  threshold: 70                    # 0-100 similarity score needed to join a cluster (tuned on tests/fixtures/cluster_pairs.yaml)

server:
  host: 127.0.0.1
  port: 8000
  reingest_interval_hours: 2

digest:
  fallback_hours: 24               # window when digests/.last_digest is missing
  top_n: 10

# Public website (built by .github/workflows/refresh-site.yml, served by Vercel)
site:
  show_descriptions: false         # publishers' article teasers stay off the public page (headlines + links only)
  exclude_sources: [AdvisorHub]    # paywalled outlet: not shown on the public page

# SEC Investment Adviser Information Reports (monthly) — used to verify firm names (§4)
sec:
  enabled: true
  page_url: https://www.sec.gov/data-research/sec-markets-data/information-about-registered-investment-advisers-exempt-reporting-advisers
  check_days: 25                   # look for a newer monthly file at most this often
