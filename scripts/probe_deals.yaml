gnews_queries:
  - '"to acquire" OR acquires OR "agrees to buy" when:1d'
  - '"merger agreement" OR "definitive agreement" OR "completes acquisition" when:1d'
  - '"investment bank" (acquire OR acquisition OR merger OR "to buy") when:3d'
  - '(RIA OR "wealth management" OR "wealth manager") (acquires OR acquisition OR "to buy") when:3d'
  - '(bank OR bancorp) ("to acquire" OR merger OR "to buy") when:2d'
  - '(software OR AI OR cybersecurity OR tech) ("to acquire" OR acquires OR "to buy") when:1d'
  - '(biotech OR pharma OR healthcare) ("to acquire" OR acquires OR "to buy") when:1d'
