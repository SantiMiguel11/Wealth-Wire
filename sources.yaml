# Each source: name, homepage, feed_url (blank = discover), gated, listing_url (optional), enabled.
# Discovery order: feed_url → previously discovered feed → <link rel="alternate"> on homepage/listing
# page → common paths (/feed, /feed/, /rss, /rss.xml) → listing-page parse → failed.
# gated: true stores headline, link, date and source only (empty description).
sources:
  - name: Citywire RIA
    homepage: https://citywire.com/ria
    kind: google_news              # no feed; the news page is JavaScript-rendered
    query: "site:citywire.com/ria"
    max_age_days: 14
    gated: false
    enabled: true

  - name: WealthManagement.com
    homepage: https://www.wealthmanagement.com
    feed_url: https://www.wealthmanagement.com/rss.xml
    listing_url: ""
    gated: false
    enabled: true

  - name: Financial Advisor Magazine
    homepage: https://www.fa-mag.com
    kind: google_news              # fa-mag.com answers HTTP 403 to automated readers
    query: "site:fa-mag.com"
    max_age_days: 14
    gated: false
    enabled: true

  - name: InvestmentNews
    homepage: https://www.investmentnews.com
    feed_url: ""
    listing_url: https://www.investmentnews.com/latest-news
    gated: false
    enabled: true

  - name: ThinkAdvisor
    homepage: https://www.thinkadvisor.com
    kind: google_news              # thinkadvisor.com answers HTTP 403 to automated readers
    query: "site:thinkadvisor.com"
    max_age_days: 14
    gated: false
    enabled: true

  - name: RIABiz
    homepage: https://riabiz.com
    feed_url: ""
    listing_url: https://riabiz.com/
    gated: false
    enabled: true

  - name: Financial Planning
    homepage: https://www.financial-planning.com
    feed_url: https://www.financial-planning.com/feed?rss=true
    listing_url: ""
    gated: false
    enabled: true

  - name: AdvisorHub
    homepage: https://www.advisorhub.com
    feed_url: https://www.advisorhub.com/feed/
    listing_url: ""
    gated: true
    enabled: true

  - name: Kitces
    homepage: https://www.kitces.com
    feed_url: https://www.kitces.com/feed/
    listing_url: ""
    gated: false
    enabled: true

  - name: SEC Press Releases
    homepage: https://www.sec.gov/newsroom/press-releases
    feed_url: https://www.sec.gov/news/pressreleases.rss
    listing_url: ""
    gated: false
    enabled: true

  - name: FINRA News
    homepage: https://www.finra.org/media-center/newsreleases
    feed_url: ""
    listing_url: https://www.finra.org/media-center/newsreleases
    gated: false
    enabled: true

  # --- press-release wires (§5): only wealth-management items are kept ---
  # PR Newswire has no keyword-scoped feed: every subject slug probed from GitHub (fund managers, financial
  # advisors, wealth management, personnel…) either falls back to the all-news firehose or is off-topic (banking,
  # M&A across all industries) — 0 wealth items. Disabled until a scoped feed exists (see DECISIONS F8).
  - name: PR Newswire
    homepage: https://www.prnewswire.com
    kind: wire
    feed_url: https://www.prnewswire.com/rss/financial-services-latest-news/financial-services-latest-news-list.rss
    max_age_days: 14
    gated: false
    enabled: false

  # GlobeNewswire keyword feeds (verified from GitHub's network 2026-09-27). Each feed is filtered on its own
  # and the stats go to state/wire_stats.csv. "registered investment adviser" (-er spelling) was dropped: its
  # newest item is from 2011. Business Wire was removed: its robots.txt disallows the feed path.
  - name: GlobeNewswire
    homepage: https://www.globenewswire.com
    kind: wire
    feed_urls:
      - https://www.globenewswire.com/RssFeed/keyword/registered%20investment%20advisor/feedTitle/GlobeNewswire%20-%20registered%20investment%20advisor
      - https://www.globenewswire.com/RssFeed/keyword/wealth%20management/feedTitle/GlobeNewswire%20-%20wealth%20management
      - https://www.globenewswire.com/RssFeed/keyword/RIA/feedTitle/GlobeNewswire%20-%20RIA
      - https://www.globenewswire.com/RssFeed/keyword/family%20office/feedTitle/GlobeNewswire%20-%20family%20office
    max_age_days: 14
    gated: false
    enabled: true
