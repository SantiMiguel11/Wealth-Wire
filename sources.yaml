# Deal sources. Every item from every source goes through the deal filter (fiduciarywire/deals.py): only
# headlines that announce an M&A deal are kept; general news is dropped (counted as "Dropped" per source).
#
# Each source: name, homepage, feed_url (blank = discover), kind (feed | wire | google_news), gated, listing_url,
# max_age_days, enabled, industry. `industry` (optional) tags every deal from a single-industry outlet with that
# industry in addition to what its headline says (names must match industries.yaml).
# Discovery order: feed_url → previously discovered feed → <link rel="alternate"> on homepage/listing page →
# common paths (/feed, /rss) → listing-page parse → failed.
# Every feed below was checked from GitHub's network with .github/workflows/probe-feeds.yml on 2026-10-17
# (robots.txt allows it; it returns items) — see DECISIONS D4.
sources:
  # --- all industries ---
  - name: PR Newswire M&A
    homepage: https://www.prnewswire.com
    kind: wire
    feed_url: https://www.prnewswire.com/rss/financial-services-latest-news/acquisitions-mergers-and-takeovers-list.rss
    max_age_days: 14
    enabled: true

  - name: Seeking Alpha M&A
    homepage: https://seekingalpha.com
    feed_url: https://seekingalpha.com/tag/m-a.xml
    max_age_days: 14
    gated: true                    # headlines are public; articles are behind a login
    enabled: true

  - name: Financial Times Companies
    homepage: https://www.ft.com/companies
    feed_url: https://www.ft.com/companies?format=rss
    max_age_days: 14
    gated: true                    # paywalled: headline, link and date only
    enabled: true

  - name: PE Hub
    homepage: https://www.pehub.com
    feed_url: https://www.pehub.com/feed/
    max_age_days: 14
    industry: Private Equity & Asset Management
    enabled: true

  - name: TechCrunch M&A
    homepage: https://techcrunch.com/tag/mergers-and-acquisitions/
    feed_url: https://techcrunch.com/tag/mergers-and-acquisitions/feed/
    max_age_days: 14
    industry: Technology
    enabled: true

  # --- wealth management and RIAs ---
  - name: WealthManagement.com
    homepage: https://www.wealthmanagement.com
    feed_url: https://www.wealthmanagement.com/rss.xml
    industry: Wealth Management & RIAs
    enabled: true

  - name: InvestmentNews
    homepage: https://www.investmentnews.com
    listing_url: https://www.investmentnews.com/latest-news
    industry: Wealth Management & RIAs
    enabled: true

  - name: RIABiz
    homepage: https://riabiz.com
    listing_url: https://riabiz.com/
    industry: Wealth Management & RIAs
    enabled: true

  - name: Financial Planning
    homepage: https://www.financial-planning.com
    feed_url: https://www.financial-planning.com/feed?rss=true
    industry: Wealth Management & RIAs
    enabled: true

  - name: AdvisorHub
    homepage: https://www.advisorhub.com
    feed_url: https://www.advisorhub.com/feed/
    gated: true
    industry: Wealth Management & RIAs
    enabled: true

  # --- other industries (Industry Dive, Fierce, insurance trade press) ---
  - name: Banking Dive
    homepage: https://www.bankingdive.com
    feed_url: https://www.bankingdive.com/feeds/news/
    max_age_days: 14
    industry: Banking
    enabled: true

  - name: Payments Dive
    homepage: https://www.paymentsdive.com
    feed_url: https://www.paymentsdive.com/feeds/news/
    max_age_days: 14
    industry: Fintech & Payments
    enabled: true

  - name: Insurance Journal
    homepage: https://www.insurancejournal.com
    feed_url: https://www.insurancejournal.com/rss/news/
    max_age_days: 14
    industry: Insurance
    enabled: true

  - name: Reinsurance News
    homepage: https://www.reinsurancene.ws
    feed_url: https://www.reinsurancene.ws/feed/
    max_age_days: 14
    industry: Insurance
    enabled: true

  - name: BioPharma Dive
    homepage: https://www.biopharmadive.com
    feed_url: https://www.biopharmadive.com/feeds/news/
    max_age_days: 14
    industry: Healthcare & Life Sciences
    enabled: true

  - name: Healthcare Dive
    homepage: https://www.healthcaredive.com
    feed_url: https://www.healthcaredive.com/feeds/news/
    max_age_days: 14
    industry: Healthcare & Life Sciences
    enabled: true

  - name: Fierce Healthcare
    homepage: https://www.fiercehealthcare.com
    feed_url: https://www.fiercehealthcare.com/rss/xml
    max_age_days: 14
    industry: Healthcare & Life Sciences
    enabled: true

  - name: Fierce Biotech
    homepage: https://www.fiercebiotech.com
    feed_url: https://www.fiercebiotech.com/rss/xml
    max_age_days: 14
    industry: Healthcare & Life Sciences
    enabled: true

  - name: Fierce Pharma
    homepage: https://www.fiercepharma.com
    feed_url: https://www.fiercepharma.com/rss/xml
    max_age_days: 14
    industry: Healthcare & Life Sciences
    enabled: true

  - name: Retail Dive
    homepage: https://www.retaildive.com
    feed_url: https://www.retaildive.com/feeds/news/
    max_age_days: 14
    industry: Consumer & Retail
    enabled: true

  - name: Utility Dive
    homepage: https://www.utilitydive.com
    feed_url: https://www.utilitydive.com/feeds/news/
    max_age_days: 14
    industry: Energy & Utilities
    enabled: true

  - name: Supply Chain Dive
    homepage: https://www.supplychaindive.com
    feed_url: https://www.supplychaindive.com/feeds/news/
    max_age_days: 14
    industry: Industrials
    enabled: true

  # --- disabled (kept so the Sources page says why) ---
  # Google News: news.google.com/robots.txt disallows /rss/search, which these used (found 2026-10-17).
  - name: ThinkAdvisor
    homepage: https://www.thinkadvisor.com
    kind: google_news
    query: "site:thinkadvisor.com"
    max_age_days: 14
    enabled: false

  - name: Financial Advisor Magazine
    homepage: https://www.fa-mag.com
    kind: google_news
    query: "site:fa-mag.com"
    max_age_days: 14
    enabled: false

  - name: Citywire RIA
    homepage: https://citywire.com/ria
    kind: google_news
    query: "site:citywire.com/ria"
    max_age_days: 14
    enabled: false

  # GlobeNewswire's robots.txt now answers HTTP 403, which is treated as "disallow everything".
  - name: GlobeNewswire
    homepage: https://www.globenewswire.com
    kind: wire
    feed_urls:
      - https://www.globenewswire.com/RssFeed/subjectcode/27-Mergers%20and%20Acquisitions/feedTitle/GlobeNewswire%20-%20Mergers%20and%20Acquisitions
    max_age_days: 14
    enabled: false

  # Regulators and planning blogs publish no deals.
  - name: SEC Press Releases
    homepage: https://www.sec.gov/newsroom/press-releases
    feed_url: https://www.sec.gov/news/pressreleases.rss
    enabled: false

  - name: FINRA News
    homepage: https://www.finra.org/media-center/newsreleases
    listing_url: https://www.finra.org/media-center/newsreleases
    enabled: false

  - name: Kitces
    homepage: https://www.kitces.com
    feed_url: https://www.kitces.com/feed/
    enabled: false
