# excluding every headline in firm_headlines.yaml. Newest first. Labeled by hand on 2026-09-27.
#
# Labeling rule: a mention is labeled only if the named organization has an SEC-registered investment adviser
# under that brand in the real SEC file (2026-09-01), checked row by row. Keys are lowercase substrings of the
# registered name, specific enough to reject a same-prefix wrong entity ("orion portfolio", not "orion").
# Not labeled: regulators, media, people, fintechs with no SEC adviser (Pontera, Hamachi, FINNY, Arch),
# broker-dealers not in the adviser file (American Portfolios, Reid & Rudiger), organizations that only share a
# name with an unrelated adviser (Blue Ocean ATS vs Blue Ocean Capital, the fintech Flourish), and brands whose
# advisers register under another name (MassMutual → MML).
#
# Caveat: not fully blind. On 2026-09-27 the matcher's output over this corpus was inspected while tuning
# (false positives were fixed), so precision here is biased upward; recall was not tuned on it.
