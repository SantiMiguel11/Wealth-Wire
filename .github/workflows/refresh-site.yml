# Refresh: fetch the news on GitHub's machines, (optionally) have Claude write the digest, rebuild the static
# site, and force-push it to the `live` branch as a single orphan commit. Vercel deploys `live`.
# Also runs when source code on main changes, and on demand from the Actions tab ("Run workflow").
name: Refresh site

on:
  schedule:
    # GitHub cron is UTC. Targets (Pacific): weekdays ~6:00, ~12:00, ~17:00; weekends ~8:00.
    # The UTC times below are anchored to Pacific *Daylight* Time (UTC-7, mid-March → early November).
    # DST drift: during Pacific *Standard* Time (UTC-8, November → March) every run happens one hour
    # earlier in local terms — weekdays ~5:00, ~11:00, ~16:00 and weekends ~7:00. GitHub cron has no
    # time-zone support; edit the hours twice a year if the hour matters to you.
    # Minute :07 avoids the top-of-the-hour queue, when scheduled GitHub jobs are most often delayed.
    - cron: "7 13,19 * * 1-5"   # Mon–Fri 13:07 and 19:07 UTC = 06:07 and 12:07 PDT
    - cron: "7 0 * * 2-6"       # Tue–Sat 00:07 UTC = Mon–Fri 17:07 PDT (previous calendar day in Pacific)
    - cron: "7 15 * * 0,6"      # Sat–Sun 15:07 UTC = 08:07 PDT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.yaml"
      - "wealthwire/**"
      - "frontend/**"
      - "schemas/**"
      - "requirements.txt"
      - ".github/workflows/refresh-site.yml"

permissions:
  contents: write

# Runs never overlap: a new run waits for the one in progress (and never cancels it mid-publish).
concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (no browser tooling needed here)
        run: |
          grep -vi '^playwright' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt

      - name: Restore state from the previous live commit
        run: |
          python -m wealthwire state fetch _prev
          python -m wealthwire state restore _prev

      - name: Ingest
        run: python -m wealthwire ingest || echo "::warning::no source ingested successfully — see state/SOURCES.md on the live branch"

      - name: Firm-matching quality report (real SEC data; kept in private state)
        continue-on-error: true
        run: python -m wealthwire eval-firms

      - name: Build site (public data + private state)
        run: python -m wealthwire build-site _live

      - name: Publish to the live branch (single orphan commit)
        run: python -m wealthwire publish _live --remote-url "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --message "Refresh $(date -u +%Y-%m-%dT%H:%MZ)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Wealth Wire refresh"
            test -f SOURCES.md && sed -n '1,/^## Failures/p' SOURCES.md | head -40
            test -f firm_eval.json && python -c "import json;r=json.load(open('firm_eval.json'));print(f\"\\nFirm matching: precision {r['precision']}, recall {r['recall']} on {r['headlines']} labeled headlines (SEC file {r['sec_data_date']})\")"
          } >> "$GITHUB_STEP_SUMMARY" || true
