# Fetches the news every 3 days on GitHub's machines, rebuilds the static site, and force-pushes it to
# the `live` branch. Vercel deploys `live` automatically (vercel.json on that branch sets it up).
# Also runs when code/config on main changes (e.g. you edit watchlist.yaml on github.com), and on demand
# from the Actions tab ("Run workflow").
name: Refresh site

on:
  schedule:
    - cron: "17 14 */3 * *"         # every 3rd day of the month at 14:17 UTC (7:17am Pacific)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.yaml"
      - "wealthwire/**"
      - "frontend/**"
      - "schemas/**"
      - "requirements.txt"
      - ".github/workflows/refresh-site.yml"

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (no browser tooling needed here)
        run: |
          grep -vi '^playwright' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt

      - name: Restore state from the previous live commit
        run: |
          python -m wealthwire state fetch _prev
          python -m wealthwire state restore _prev

      - name: Ingest
        run: python -m wealthwire ingest || echo "::warning::no source ingested successfully — see state/SOURCES.md on the live branch"

      - name: Build site (public data + private state)
        run: python -m wealthwire build-site _live

      - name: Publish to the live branch (single orphan commit)
        run: python -m wealthwire publish _live --remote-url "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --message "Refresh $(date -u +%Y-%m-%dT%H:%MZ)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Wealth Wire refresh"
            test -f SOURCES.md && sed -n '1,/^## Failures/p' SOURCES.md | head -40
          } >> "$GITHUB_STEP_SUMMARY" || true
