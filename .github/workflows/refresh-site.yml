# Refresh: fetch the news on GitHub's machines, (optionally) have Claude write the digest, rebuild the static
# site, and force-push it to the `live` branch as a single orphan commit. Vercel deploys `live`.
# Also runs when source code on main changes, and on demand from the Actions tab ("Run workflow").
name: Refresh site

on:
  schedule:
    # GitHub cron is UTC. Targets (Pacific): weekdays ~6:00, ~12:00, ~17:00; weekends ~8:00.
    # The UTC times below are anchored to Pacific *Daylight* Time (UTC-7, mid-March → early November).
    # DST drift: during Pacific *Standard* Time (UTC-8, November → March) every run happens one hour
    # earlier in local terms — weekdays ~5:00, ~11:00, ~16:00 and weekends ~7:00. GitHub cron has no
    # time-zone support; edit the hours twice a year if the hour matters to you.
    # Minute :07 avoids the top-of-the-hour queue, when scheduled GitHub jobs are most often delayed.
    - cron: "7 13,19 * * 1-5"   # Mon–Fri 13:07 and 19:07 UTC = 06:07 and 12:07 PDT
    - cron: "7 0 * * 2-6"       # Tue–Sat 00:07 UTC = Mon–Fri 17:07 PDT (previous calendar day in Pacific)
    - cron: "7 15 * * 0,6"      # Sat–Sun 15:07 UTC = 08:07 PDT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.yaml"
      - "wealthwire/**"
      - "frontend/**"
      - "schemas/**"
      - "requirements.txt"
      - "prompts/**"
      - ".github/workflows/refresh-site.yml"

permissions:
  contents: write
  id-token: write   # claude-code-action can authenticate through GitHub OIDC; harmless otherwise

# Runs never overlap: a new run waits for the one in progress (and never cancels it mid-publish).
concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Step conditions can't read secrets directly; these flags say whether an optional secret is set.
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (no browser tooling needed here)
        run: |
          grep -vi '^playwright' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt

      - name: Restore state from the previous live commit
        run: |
          python -m wealthwire state fetch _prev
          python -m wealthwire state restore _prev

      - name: Ingest
        run: python -m wealthwire ingest || echo "::warning::no source ingested successfully — see state/SOURCES.md on the live branch"

      - name: Prepare the digest input (top 15 stories; weekly M&A input on Pacific Fridays)
        id: dinput
        run: python -m wealthwire digest-input

      # Claude writes the summaries from headlines and teasers only (prompts/digest.md). It gets file
      # Read/Write and nothing else: no shell, no web. Skipped on code pushes (only scheduled and manual runs
      # write a digest), when no Claude secret is set, or when there is nothing to summarize. Any failure here
      # just means the site shows the plain ranked list.
      - name: Write the digest with Claude
        if: >-
          env.HAS_CLAUDE == 'true' && github.event_name != 'push' &&
          (steps.dinput.outputs.clusters != '0' || steps.dinput.outputs.weekly == 'true')
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read prompts/digest.md in this repository and follow it exactly. Your only inputs are
            _work/digest_input.json and, if it exists, _work/weekly_input.json. Write only
            _work/digest_output.json and, if the weekly input exists, _work/weekly_output.json.
            Do not fetch or open any web page or link.
          claude_args: >-
            --allowedTools "Read,Write"
            --disallowedTools "Bash,Edit,WebFetch,WebSearch,NotebookEdit"
            --max-turns 12

      - name: No Claude secret
        if: env.HAS_CLAUDE != 'true'
        run: |
          echo "::notice::AI digest skipped: no CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret (see MANUAL-STEPS.md). The site shows the plain ranked list."

      - name: Validate the digest (falls back to the plain list if invalid)
        run: python -m wealthwire digest-finalize | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Firm-matching quality report (real SEC data; kept in private state)
        continue-on-error: true
        run: python -m wealthwire eval-firms

      - name: Build site (public data + private state)
        run: python -m wealthwire build-site _live

      - name: Publish to the live branch (single orphan commit)
        run: python -m wealthwire publish _live --remote-url "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --message "Refresh $(date -u +%Y-%m-%dT%H:%MZ)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Watchlist email (optional; skipped unless WATCHLIST_JSON, RESEND_API_KEY and ALERT_EMAIL are set)
        continue-on-error: true
        run: python -m wealthwire alert
        env:
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Remove scratch files (they contain publisher teasers)
        if: always()
        run: rm -rf _work

      - name: Summary
        if: always()
        run: |
          {
            echo "### Wealth Wire refresh"
            test -f SOURCES.md && sed -n '1,/^## Failures/p' SOURCES.md | head -40
            test -f wire_stats.csv && { echo; echo "Wire feeds this run (full history: state/wire_stats.csv on live):"; echo '```'; grep "^$(tail -n1 wire_stats.csv | cut -d, -f1)," wire_stats.csv | cut -d, -f2- | sed 's#https://www.globenewswire.com/RssFeed/keyword/##; s#/feedTitle/[^,]*##'; echo '```'; }
            test -f firm_eval.json && python -c "import json;r=json.load(open('firm_eval.json'));print(f\"\\nFirm matching: precision {r['precision']}, recall {r['recall']} on {r['headlines']} labeled headlines (SEC file {r['sec_data_date']})\")"
          } >> "$GITHUB_STEP_SUMMARY" || true
