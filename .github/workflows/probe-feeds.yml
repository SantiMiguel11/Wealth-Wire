# On-demand check of candidate feeds from GitHub's network (the build sandbox can't reach these hosts).
# Read-only: restores the SEC data from `live` so the wealth filter can be applied, prints results, publishes
# nothing. Run from the Actions tab or the API; `urls` adds extra feed URLs to try.
name: Fiduciary Wire feed probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Extra feed URLs to probe (space-separated)"
        required: false
        default: ""
      candidates:
        description: "Candidates file"
        required: false
        default: "scripts/probe_candidates.yaml"
      titles:
        description: "Sample titles printed per feed"
        required: false
        default: "6"
      inspect_sec:
        description: "Instead: print the SEC adviser file's columns and check the Census ZIP gazetteer"
        type: boolean
        default: false
      only_extra:
        description: "Probe only the extra URLs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          grep -vi '^playwright' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
      - name: Restore state from live
        run: |
          python -m fiduciarywire state fetch _prev
          python -m fiduciarywire state restore _prev
      - name: Probe
        env:
          EXTRA: ${{ inputs.urls }}
          ONLY: ${{ inputs.only_extra }}
          CANDIDATES: ${{ inputs.candidates }}
          TITLES: ${{ inputs.titles }}
          INSPECT_SEC: ${{ inputs.inspect_sec }}
        run: |
          if [ "$INSPECT_SEC" = "true" ]; then python scripts/inspect_sec.py; exit 0; fi
          flag=""; [ "$ONLY" = "true" ] && flag="--only-extra"
          python scripts/probe_feeds.py --extra "$EXTRA" --candidates "${CANDIDATES:-scripts/probe_candidates.yaml}" --titles "${TITLES:-6}" $flag | tee -a "$GITHUB_STEP_SUMMARY"
